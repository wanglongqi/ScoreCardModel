site_name: ScoreCardModel
site_description: A professional and modern toolset for scorecard modeling, fully compatible with scikit-learn
site_author: ScoreCardModel Authors
site_url: https://scorecardmodel.readthedocs.io/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User Guides:
      - WOE In-Depth: woe_in_depth.md
      - Best Practices: best_practices.md
  - Examples & Visualizations:
      - Overview: examples.md
      - Taiwan Credit: examples/taiwan_credit_report.md
      - German Credit: examples/german_credit_report.md
      - Give Me Some Credit: examples/give_me_some_credit_report.md
      - Breast Cancer: examples/breast_cancer_report.md
  - API Reference: api.md

plugins:
  - search
