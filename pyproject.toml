[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ScoreCardModel"
version = "2.0.0"
description = "A professional and modern toolset for scorecard modeling, fully compatible with scikit-learn"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["scorecard", "credit risk", "woe", "binning", "scikit-learn"]
authors = [
    {name = "deepseek-v4+longqi"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "optbinning",
    "matplotlib",
    "seaborn",
]

[project.urls]
Homepage = "https://github.com/wanglongqi/ScoreCardModel"
Repository = "https://github.com/wanglongqi/ScoreCardModel"
Documentation = "https://github.com/wanglongqi/ScoreCardModel/tree/master/docs"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "ruff",
    "mypy",
    "pandas-stubs",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ScoreCardModel",
    "/tests",
    "/docs",
    "/example.py",
]

[tool.hatch.build.targets.wheel]
packages = ["ScoreCardModel"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]
ignore = ["N999", "N803", "N806", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
